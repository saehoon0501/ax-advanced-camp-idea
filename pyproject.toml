[project]
name = "ax-incubation-advanced-camp-idea-dexter"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "langchain>=1.1.3",
    "langchain-aws>=1.1.0",
    "langgraph>=1.0.5",
    "rich>=13.7.0",
]

[project.scripts]
incubation-camp-cli = "ax_advanced_class.src.main:main"

[tool.uv]
package = true

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ax_advanced_class*"]
